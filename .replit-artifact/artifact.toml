kind = "web"
previewPath = "/"
title = "English Flashcards"
version = "1.0.0"
id = "artifacts/english-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19986

[services.development]
run = "pnpm --filter @workspace/english-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/english-app", "run", "build" ]
publicDir = "artifacts/english-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19986"
BASE_PATH = "/"
